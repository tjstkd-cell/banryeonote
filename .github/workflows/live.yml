name: banryeonote-live

on:
  schedule:
    - cron: "10 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: live data
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PYTHONIOENCODING: utf-8
        run: python live.py
      - name: save
        run: |
          git config user.name "banryeonote-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "live $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
